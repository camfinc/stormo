name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt -w ."; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: build every released platform
        run: PLATFORMS="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64" scripts/release-build.sh "ci-${GITHUB_SHA::7}"
