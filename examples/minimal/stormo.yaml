# Example Stormo instance: a made-up organisation (Acme) with two units and three agents, all on
# needletail (its image is a local build: docs/instances.md, "Engines"). It is the engine's test
# fixture and the template for a new instance (docs/instances.md). No real ids.
name: Acme Swarm
org: Acme
slug: acme
# names: default to acme-stormo, acme/stormo, acme-state, acme-knowledge, acme-shared-docs

scrub:
  token_prefixes: [acme]        # Acme CRM tokens look like acme_…
  rules:                        # Acme's own PII, on top of the engine's (tokens, email, card, phone)
    - kind: order-id
      pattern: '\b[A-Z]{2}[0-9A-Z]{6}\b'
      require: ['\d', '[A-Z]']   # each must also match: 8 alphanumerics with digits and letters

bridge:
  actions: bridge/actions.yaml

office:
  clocks:
    - { city: New York, tz: America/New_York }
    - { city: Lisbon, tz: Europe/Lisbon }

# The swarm core's learning cycle (nap, then dream, agent by agent) is opt-in: uncomment to run it
# every night. Without `at` it never starts on its own; `stormo core learn` still runs one.
# core:
#   learning:
#     at: "03:00"
#     timezone: America/New_York
#     review_prompt: review/rules.md   # your rules for the automatic review, appended to the built-in ones
#     auto_restart: true         # restart the agent (when idle) so what the review approved applies

deploy:
  aws:
    account: "123456789012"
    region: us-east-2
    cluster: acme-ecs
    bucket: acme-stormo-naps
    registry: ghcr.io/acme
    execution_role_arn: arn:aws:iam::123456789012:role/ecsTaskExecutionRole
    task_role_arn: arn:aws:iam::123456789012:role/acme-stormo-task

# capabilities:                   # heavy calls the core runs for agents (docs/capabilities.md), granted in agent.yaml capabilities:
#   audio.transcribe: {template: transcribe}   # bundled templates: transcribe, browser, video (services, asleep when idle)
#   web.browse: {template: browser}

core:
  web_ui: false                   # the office and review pages in a browser; the macOS app needs none of it
  llm_concurrency: 3              # model calls the core's gateway runs at once for the whole fleet (1 to 64)
