# What only needletail reads (docs/needletail.md §4.1); agent.yaml stays engine-neutral.
timezone: America/New_York      # the agent's wall clock: its schedules' cron and the time it is told

luau:
  # What Atlas's Luau tools may use besides reading its home and writing its conversation's work/ (and the
  # core's msg_* tools on the core); fs.write:home/<dir>/** for a tool that writes elsewhere in the home.
  # The CRM token never reaches a script: the runtime adds it as a header to requests to that host.
  grants: [http:crm.example.com, fs.read:shared]
  http_secrets:
    - host: crm.example.com
      env: CRM_API_TOKEN
      header: Authorization
      template: "Bearer {value}"
  # timeout: 30                 # seconds a Luau tool the model calls may run (1 to 600)

