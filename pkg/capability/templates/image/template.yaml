description: Generate an image from a prompt, optionally guided by reference images, with a current image model - backgrounds, scenes, illustrations, stickers on a transparent background.
files: both
port: 8080
health: /health
concurrency: 2
timeout_minutes: 5
idle_minutes: 5
boot_minutes: 1
memory_mb: 256
input_schema:
  type: object
  required: [prompt]
  properties:
    prompt: {type: string, description: "what to draw: subject, place, light, composition, style; say where to leave calm room for text, and 'no text' when none is wanted"}
    model: {type: string, description: "an OpenRouter image model (default openai/gpt-image-2.5-flare)"}
    aspect_ratio: {type: string, description: "9:16, 16:9, 1:1, 3:4, 4:3, 2:3, 3:2… (each model takes its own set)"}
    quality: {type: string, enum: [low, medium, high], description: "GPT Image models: more detail, more cost"}
    resolution: {type: string, description: "1K, 2K or 4K for the models that take it (Nano Banana, Flux, Seedream)"}
    background: {type: string, enum: [auto, opaque, transparent], description: "GPT Image models: transparent for a sticker or cutout"}
    references: {type: array, items: {type: string}, description: "names of the handed-over images to guide it (all of them when left out)"}
    name: {type: string, description: "base name of the file written (default image)"}
examples:
  - {prompt: "A colourful colonial street at golden hour, the upper third open sky, no text, no people", aspect_ratio: "9:16"}
  - {prompt: "The same place at night with lanterns", references: ["frame.png"], aspect_ratio: "16:9", model: "google/gemini-nano-banana-2.1", resolution: "2K"}
  - {prompt: "A die-cut sticker of a vintage suitcase, white border", background: transparent, aspect_ratio: "1:1"}
notes: "Paid per image on the instance's OpenRouter account: declare it with secrets: [OPENROUTER_API_KEY] and a cost_usd estimate (GPT Image 2.5 Flare at medium quality was about $0.01 for 9:16 in October 2026). Models as of October 2026: openai/gpt-image-2.5-flare (default; GPT Image 2.5 led the text-to-image arenas), openai/gpt-image-2.5-sunburst, google/gemini-nano-banana-2.1, black-forest-labs/flux-3-image, bytedance-seed/seedream-5-0-pro; GET https://openrouter.ai/api/v1/images/models lists the current ones."
