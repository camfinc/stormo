# engine/needletail/config.yaml as an agent would commit it (grants are outside skills/).
luau:
  grants: [http:api.example.com, fs.read:shared, fs.read:home]
  http_secrets:
    - host: api.example.com
      env: CRM_API_TOKEN
      header: Authorization
      template: "Bearer {value}"
memory:
  recall: {auto: true, jobs: true, max: 3, budget: 800}
