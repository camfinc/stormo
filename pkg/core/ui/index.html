<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{name}} HQ</title>
  <meta name="description" content="Live top-down view of {{name}}: every agent at its desk, the core in the commons.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%230d141c%22/%3E%3Ccircle cx=%2239.02%22 cy=%2237.80%22 r=%223.16%22 fill=%22%232dd4bf%22/%3E%3Ccircle cx=%2239.88%22 cy=%2251.57%22 r=%223.62%22 fill=%22%2338cbc6%22/%3E%3Ccircle cx=%2230.08%22 cy=%2251.92%22 r=%224.08%22 fill=%22%2342c2cd%22/%3E%3Ccircle cx=%2222.58%22 cy=%2246.17%22 r=%224.54%22 fill=%22%234cb9d4%22/%3E%3Ccircle cx=%2219.46%22 cy=%2237.44%22 r=%225.00%22 fill=%22%2357b0dc%22/%3E%3Ccircle cx=%2220.90%22 cy=%2228.40%22 r=%225.46%22 fill=%22%2362a7e3%22/%3E%3Ccircle cx=%2226.11%22 cy=%2220.96%22 r=%225.92%22 fill=%22%236c9eea%22/%3E%3Ccircle cx=%2233.82%22 cy=%2216.27%22 r=%226.38%22 fill=%22%237695f1%22/%3E%3Ccircle cx=%2242.69%22 cy=%2214.84%22 r=%226.84%22 fill=%22%23818cf8%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/ui/style.css">
</head>
<body>
  <header class="hud" aria-label="Fleet overview">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">{{name}} <b>HQ</b></span>
    </div>
    <ul class="meters" id="meters"></ul>
    <div class="clock" id="clock" aria-label="Local time"></div>
  </header>

  <main class="stage">
    <div class="floor" id="floor" aria-label="Office floor"></div>
    <svg class="links" id="links" aria-hidden="true"></svg>
    <aside class="feed" aria-label="Activity" aria-live="polite"><ol id="feed"></ol></aside>
  </main>

  <aside class="inspector" id="inspector" aria-label="Details" hidden>
    <button class="close" id="close" aria-label="Close details">×</button>
    <div id="inspector-body"></div>
  </aside>

  <div class="welcome" id="welcome" role="status">
    <p class="welcome-kicker">Welcome to</p>
    <h1>{{name}} HQ</h1>
    <p class="welcome-sub" id="welcome-sub">Opening the office…</p>
  </div>

  <div class="toast" id="toast" role="alert" hidden></div>

  <script>window.STORMO = {{instance}};</script>
  <script type="module" src="/ui/app.js"></script>
</body>
</html>
